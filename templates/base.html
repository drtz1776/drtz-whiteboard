
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DRTZ Whiteboard{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script>
        // Apply saved theme before rendering the page
        if (
            localStorage.getItem("theme") === "dark" ||
            (!localStorage.getItem("theme") &&
             window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</head>

<body>

    <header class="site-header">
        <div class="header-container">

            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-icon">D.</span>
                <span class="brand-name">drtz / whiteboard</span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="{{ url_for('home') }}"
                   class="{{ 'active' if request.endpoint == 'home' else '' }}">
                    Home
                </a>

                <a href="{{ url_for('projects') }}"
                   class="{{ 'active' if request.endpoint == 'projects' else '' }}">
                    Projects
                </a>

                <a href="{{ url_for('about') }}"
                   class="{{ 'active' if request.endpoint == 'about' else '' }}">
                    About
                </a>

                <a href="{{ url_for('books') }}"
                   class="{{ 'active' if request.endpoint == 'books' else '' }}">
                    Books
                </a>

                <a href="{{ url_for('resume') }}"
                   class="{{ 'active' if request.endpoint == 'resume' else '' }}">
                    Resume
                </a>
            </nav>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark mode"
                aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☾</span>
            </button>

        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
